name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The screenshot workflow starts this on its own commit, which GitHub doesn't do by itself.
  workflow_dispatch:

# A newer commit on the same pull request makes an older run pointless.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
