<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tare Weight Tracker</title>
  <meta name="description" content="Tare: a modern weight tracker with goal pace, BMI, a calorie calculator and body measurements. Your data stays on your device.">
  <meta name="theme-color" content="#EDF0EF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B100F" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="top-row">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="16" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 11a4 4 0 0 1 8 0" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/><path d="M12 11l2-2" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/></svg>
          <h1>Tare</h1>
        </div>
        <div class="ctrl">
          <button type="button" class="btn ghost" id="installBtn" hidden>Install app</button>
          <select id="profileSel" class="profile-sel" aria-label="Profile"></select>
          <div class="seg" role="group" aria-label="Units" id="unitSeg">
            <button type="button" data-unit="kg">kg</button>
            <button type="button" data-unit="lb">lb</button>
            <button type="button" data-unit="st">st</button>
          </div>
          <button type="button" class="btn primary" id="logBtn">+ Log weight</button>
        </div>
      </div>
      <nav class="tabs" aria-label="Sections">
        <a href="#overview" data-tab="overview">Overview</a>
        <a href="#history" data-tab="history">History</a>
        <a href="#body" data-tab="body">Body</a>
        <a href="#calories" data-tab="calories">Calories</a>
        <a href="#profile" data-tab="profile">Profile<span class="long"> &amp; goal</span></a>
      </nav>
    </header>
    <div class="banner update" id="updateBar" hidden>
      <span>A new version of Tare is ready.</span>
      <button type="button" class="btn primary" id="updateGo">Reload</button>
    </div>
    <main id="view"><p class="note">Loading…</p></main>
  </div>

  <dialog id="entryDlg" aria-labelledby="entryTitle">
    <form id="entryForm" class="form" novalidate>
      <div class="card-head flush">
        <h2 id="entryTitle">Log weight</h2>
        <button type="button" class="btn ghost" id="entryClose">Close</button>
      </div>
      <div class="fields">
        <label class="f">Date<input type="date" id="eDate" required></label>
      </div>
      <div id="eWeightWrap"></div>
      <label class="f">Note<textarea id="eNote" rows="2" maxlength="500" placeholder="How did today go?"></textarea></label>
      <details id="eMeasDetails">
        <summary>Body measurements (optional)</summary>
        <div class="fields" id="eMeas"></div>
      </details>
      <p class="note" id="eExists" hidden>You already logged this date. Saving replaces that entry.</p>
      <p class="warnbox" id="eError" role="alert" hidden></p>
      <div class="actions">
        <button type="button" class="btn danger spacer" id="eDelete" hidden>Delete entry</button>
        <button type="button" class="btn" id="entryCancel">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:16px">Tare needs JavaScript to run.</p></noscript>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
